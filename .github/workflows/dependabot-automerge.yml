name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-update:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'emotigom/nextbridge' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for verify, squash merge, and deploy
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr checks --required --watch --fail-fast "$PR_URL"
          if ! gh api \
            --method PUT \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            --silent
          then
            test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .merged)" = "true"
          fi
          gh api \
            --method POST \
            "repos/$REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref=main \
            --silent
