name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source and production build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          ASTRO_BASE_PATH: /nextbridge
          ASTRO_SITE_URL: https://emotigom.github.io
          PUBLIC_SUPABASE_URL: https://cwxxhzfppvkuqvmmhgiq.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_i3z38Xk7C2giiZPELGA5aw_FQGdzOw7
          PUBLIC_QUESTION_API_BASE_URL: https://cwxxhzfppvkuqvmmhgiq.supabase.co/functions/v1
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEOocmb3Aobr0xCU
        run: npm run verify
