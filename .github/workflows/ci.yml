name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source and production build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          ASTRO_BASE_PATH: /nextbridge
          ASTRO_SITE_URL: https://emotigom.github.io
        run: npm run verify
