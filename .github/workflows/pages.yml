name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Verify and build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          ASTRO_BASE_PATH: /nextbridge
          ASTRO_SITE_URL: https://emotigom.github.io
          PUBLIC_SUPABASE_URL: https://cwxxhzfppvkuqvmmhgiq.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_i3z38Xk7C2giiZPELGA5aw_FQGdzOw7
          PUBLIC_QUESTION_API_BASE_URL: https://cwxxhzfppvkuqvmmhgiq.supabase.co/functions/v1
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEOocmb3Aobr0xCU
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
